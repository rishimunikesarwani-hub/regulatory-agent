AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Regulatory Agent development cases and documents. Fictional data only.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: docs/delivery/spec-slice-01-cases.md
        has: Case flow, authentication, and deployment conditions.
Parameters:
  CommitSha:
    Type: String
    AllowedPattern: '[a-f0-9]{40}'
  CaseRuntimeRoleArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/regulatory-agent-dev-case-runtime'
  AssessmentsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable only after the remaining VS5 release conditions pass.
Conditions:
  AssessmentsEnabled: {Fn::Equals: [{Ref: AssessmentsEnabled}, 'true']}
Rules:
  MumbaiOnly:
    Assertions:
      - Assert:
          Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]
        AssertDescription: Private records and logs must stay in Mumbai.
Resources:
  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: {Fn::Sub: 'regulatory-agent-dev-s01-documents-${AWS::AccountId}-ap-south-1'}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [{Fn::Sub: 'https://${Frontend.DomainName}'}]
            AllowedMethods: [GET, POST]
            AllowedHeaders: [Content-Type]
            MaxAge: 300
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: DocumentsBucket}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - {Fn::GetAtt: [DocumentsBucket, Arn]}
              - {Fn::Sub: '${DocumentsBucket.Arn}/*'}
            Condition: {Bool: {'aws:SecureTransport': false}}
          - Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: {Fn::Sub: '${DocumentsBucket.Arn}/*'}
            Condition: {StringNotEquals: {'s3:x-amz-server-side-encryption': AES256}}
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  FrontendAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: {Fn::Sub: '${AWS::StackName}-public-assets'}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: {Fn::Sub: '${AWS::StackName}-headers'}
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, Override: true}
  Frontend:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: public-assets
            DomainName: {Fn::GetAtt: [FrontendBucket, RegionalDomainName]}
            OriginAccessControlId: {Ref: FrontendAccess}
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: public-assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          MinTTL: 0
          DefaultTTL: 3600
          MaxTTL: 86400
          ForwardedValues:
            QueryString: false
            Cookies: {Forward: none}
          ResponseHeadersPolicyId: {Ref: FrontendHeaders}
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: FrontendBucket}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: {Fn::Sub: '${FrontendBucket.Arn}/*'}
            Condition:
              StringEquals:
                AWS:SourceArn: {Fn::Sub: 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Frontend}'}
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - {Fn::GetAtt: [FrontendBucket, Arn]}
              - {Fn::Sub: '${FrontendBucket.Arn}/*'}
            Condition: {Bool: {'aws:SecureTransport': false}}
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: {Fn::Sub: '${AWS::StackName}-operators'}
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameConfiguration: {CaseSensitive: false}
      Policies:
        PasswordPolicy: {MinimumLength: 14, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true}
      UserPoolTier: LITE
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: {Ref: UserPool}
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [{Fn::Sub: 'https://${Frontend.DomainName}/'}]
      LogoutURLs: [{Fn::Sub: 'https://${Frontend.DomainName}/'}]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: {Ref: UserPool}
      Domain: {Fn::Sub: '${AWS::StackName}-${AWS::AccountId}'}
      ManagedLoginVersion: 1
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingRateLimit: 2
        ThrottlingBurstLimit: 4
      CorsConfiguration:
        AllowOrigins: [{Fn::Sub: 'https://${Frontend.DomainName}'}]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
        MaxAge: 300
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [openid]
            JwtConfiguration:
              issuer: {Fn::Sub: 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'}
              audience: [{Ref: UserPoolClient}]
  CaseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Use a fixed role so application deployment cannot expand its own permissions.
        must: Permit only development case records, document objects, and application logs.
    Properties:
      Role: {Ref: CaseRuntimeRoleArn}
      CodeUri: ../runs/private/sam-package/
      Handler: regulatory_agent.aws_cases.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          APP_ENV: aws
          CASES_TABLE: {Ref: CasesTable}
          DOCUMENTS_BUCKET: {Ref: DocumentsBucket}
          AWS_ACCOUNT_ID: {Ref: 'AWS::AccountId'}
          USER_POOL_ID: {Ref: UserPool}
          USER_POOL_CLIENT_ID: {Ref: UserPoolClient}
          COMMIT_SHA: {Ref: CommitSha}
          ASSESSMENTS_ENABLED: {Ref: AssessmentsEnabled}
          ASSESSMENT_QUEUE_URL: {Fn::If: [AssessmentsEnabled, {Ref: AssessmentQueue}, '']}
      Events:
        AssessmentSelection:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessment-selection', Method: GET, PayloadFormatVersion: '2.0'}
        ComparisonSelection:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons/selection', Method: GET, PayloadFormatVersion: '2.0'}
        ListComparisons:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons', Method: GET, PayloadFormatVersion: '2.0'}
        StartComparison:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons', Method: POST, PayloadFormatVersion: '2.0'}
        ReadComparison:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons/{comparison_id}', Method: GET, PayloadFormatVersion: '2.0'}
        ResumeComparison:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons/{comparison_id}/resume', Method: POST, PayloadFormatVersion: '2.0'}
        ReassessComparison:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/regulatory-comparisons/{comparison_id}/reassess', Method: POST, PayloadFormatVersion: '2.0'}
        SelectedAssessment:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/selected', Method: POST, PayloadFormatVersion: '2.0'}
        ListAssessments:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments', Method: GET, PayloadFormatVersion: '2.0'}
        ReadAssessment:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}', Method: GET, PayloadFormatVersion: '2.0'}
        ResumeAssessment:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}/resume', Method: POST, PayloadFormatVersion: '2.0'}
        ExportAssessment:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}/export', Method: POST, PayloadFormatVersion: '2.0'}
        AssessmentSource:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}/sources/{version_id}', Method: GET, PayloadFormatVersion: '2.0'}
        AssessmentOriginal:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}/sources/{version_id}/original', Method: GET, PayloadFormatVersion: '2.0'}
        FindingReview:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/assessments/{job_id}/findings/{finding_id}/reviews', Method: POST, PayloadFormatVersion: '2.0'}
        CreateCase:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: /api/cases, Method: POST, PayloadFormatVersion: '2.0'}
        ListCases:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: /api/cases, Method: GET, PayloadFormatVersion: '2.0'}
        ReadCase:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}', Method: GET, PayloadFormatVersion: '2.0'}
        ReserveUpload:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/uploads', Method: POST, PayloadFormatVersion: '2.0'}
        UploadStatus:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/uploads/{upload_id}', Method: GET, PayloadFormatVersion: '2.0'}
        FinalizeUpload:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/uploads/{upload_id}/finalize', Method: POST, PayloadFormatVersion: '2.0'}
        CancelUpload:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/uploads/{upload_id}/cancel', Method: POST, PayloadFormatVersion: '2.0'}
        ListDocuments:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/documents', Method: GET, PayloadFormatVersion: '2.0'}
        ReadDocument:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/documents/{version_id}', Method: GET, PayloadFormatVersion: '2.0'}
        DownloadDocument:
          Type: HttpApi
          Properties: {ApiId: {Ref: HttpApi}, Path: '/api/cases/{case_id}/documents/{version_id}/original', Method: GET, PayloadFormatVersion: '2.0'}
        Health:
          Type: HttpApi
          Properties:
            ApiId: {Ref: HttpApi}
            Path: /api/health
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth: {Authorizer: NONE}
  CaseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {Fn::Sub: '/aws/lambda/${CaseFunction}'}
  AssessmentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: AssessmentsEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: regulatory-agent-dev-assessments-dead
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns: [{Fn::Sub: 'arn:aws:sqs:ap-south-1:${AWS::AccountId}:regulatory-agent-dev-assessments'}]
  AssessmentQueue:
    Type: AWS::SQS::Queue
    Condition: AssessmentsEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: regulatory-agent-dev-assessments
      SqsManagedSseEnabled: true
      VisibilityTimeout: 3960
      MessageRetentionPeriod: 86400
      RedrivePolicy: {deadLetterTargetArn: {Fn::GetAtt: [AssessmentDeadLetterQueue, Arn]}, maxReceiveCount: 5}
  AssessmentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: AssessmentsEnabled
    Properties:
      Queues: [{Ref: AssessmentQueue}, {Ref: AssessmentDeadLetterQueue}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: [{Fn::GetAtt: [AssessmentQueue, Arn]}, {Fn::GetAtt: [AssessmentDeadLetterQueue, Arn]}]
            Condition: {Bool: {'aws:SecureTransport': false}}
  AssessmentWorker:
    Type: AWS::Serverless::Function
    Condition: AssessmentsEnabled
    Properties:
      FunctionName: {Fn::Sub: '${AWS::StackName}-assessment-worker'}
      Role: {Fn::Sub: 'arn:aws:iam::${AWS::AccountId}:role/regulatory-agent-dev-assessment-worker'}
      CodeUri: ../runs/private/sam-package/
      Handler: regulatory_agent.aws_execution.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 660
      Environment:
        Variables:
          APP_ENV: aws
          CASES_TABLE: {Ref: CasesTable}
          DOCUMENTS_BUCKET: {Ref: DocumentsBucket}
          AWS_ACCOUNT_ID: {Ref: 'AWS::AccountId'}
          ASSESSMENT_QUEUE_ARN: {Fn::GetAtt: [AssessmentQueue, Arn]}
          COMMIT_SHA: {Ref: CommitSha}
      Events:
        QueuedAssessment:
          Type: SQS
          Properties:
            Queue: {Fn::GetAtt: [AssessmentQueue, Arn]}
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: {MaximumConcurrency: 2}
  AssessmentWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: AssessmentsEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {Fn::Sub: '/aws/lambda/${AssessmentWorker}'}
Outputs:
  AssessmentsEnabled: {Value: {Ref: AssessmentsEnabled}}
  FrontendUrl: {Value: {Fn::Sub: 'https://${Frontend.DomainName}'}}
  FrontendBucket: {Value: {Ref: FrontendBucket}}
  DistributionId: {Value: {Ref: Frontend}}
  ApiUrl: {Value: {Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'}}
  UserPoolId: {Value: {Ref: UserPool}}
  UserPoolClientId: {Value: {Ref: UserPoolClient}}
  CognitoDomain: {Value: {Fn::Sub: 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'}}
  CasesTable: {Value: {Ref: CasesTable}}
  DocumentsBucket: {Value: {Ref: DocumentsBucket}}
  CommitSha: {Value: {Ref: CommitSha}}
